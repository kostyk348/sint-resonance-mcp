[project]
name = "sint-resonance-mcp"
version = "0.1.0"
description = "Resonance Detection MCP server — cross-domain pattern matching"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=0.5.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["resonance*"]
